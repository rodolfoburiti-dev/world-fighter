# Publica o jogo no GitHub Pages. Só roda quando acionado à mão (Actions → Run workflow),
# depois de ativar Settings → Pages → Source: GitHub Actions. Ver docs/PUBLICAR.md.
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar a cópia com a versão carimbada
        run: python tools/build_site.py --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/worldfight
      - id: deploy
        uses: actions/deploy-pages@v4
